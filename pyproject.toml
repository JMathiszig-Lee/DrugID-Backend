[project]
name = "drugid-backend"
version = "0.1.0"
description = "Backend for the Ampoule drug-identification reaction-time study"
requires-python = ">=3.14,<3.15"
dependencies = [
    "dj-database-url==3.1.2",
    "django==5.2.16",
    "djangorestframework==3.17.1",
    "gunicorn==26.0.0",
    "psycopg[binary]==3.3.4",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "coverage==7.15.2",
    "pytest==9.1.1",
    "pytest-django==4.13.0",
    "ruff==0.15.22",
]
analysis = [
    "matplotlib==3.11.1",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "scipy==1.18.0",
    "statsmodels==0.14.6",
]

[tool.uv]
package = false
required-version = ">=0.11.28,<0.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "DrugID.settings"
addopts = [
    "--strict-config",
    "--strict-markers",
]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["DrugID_API", "analysis/tests"]

[tool.coverage.run]
branch = true
source = ["DrugID_API", "analysis/ampoule_analysis"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
